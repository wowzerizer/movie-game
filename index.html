<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="Movie Connect: get two random actors and try to link them through movies.">
<title>Movie Connect</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<svg class="icon-sprite" aria-hidden="true" focusable="false">
  <symbol id="icon-reel" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"></circle>
    <circle cx="12" cy="12" r="2.1" fill="currentColor" stroke="none"></circle>
    <circle cx="12" cy="5.7" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="17.5" cy="9.4" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="15.4" cy="15.9" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="8.6" cy="15.9" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="6.5" cy="9.4" r="1.5" fill="currentColor" stroke="none"></circle>
  </symbol>
  <symbol id="icon-settings" viewBox="0 0 24 24">
    <line x1="4" y1="7" x2="20" y2="7"></line>
    <circle cx="9" cy="7" r="2" fill="currentColor" stroke="none"></circle>
    <line x1="4" y1="12" x2="20" y2="12"></line>
    <circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"></circle>
    <line x1="4" y1="17" x2="20" y2="17"></line>
    <circle cx="11" cy="17" r="2" fill="currentColor" stroke="none"></circle>
  </symbol>
  <symbol id="icon-refresh" viewBox="0 0 24 24">
    <path d="M20 11A8 8 0 1 0 17.4 17.1"></path>
    <polyline points="20 4 20 11 13 11"></polyline>
  </symbol>
  <symbol id="icon-close" viewBox="0 0 24 24">
    <line x1="5" y1="5" x2="19" y2="19"></line>
    <line x1="19" y1="5" x2="5" y2="19"></line>
  </symbol>
</svg>

<div class="bg-fx" aria-hidden="true">
  <span class="orb orb-a"></span>
  <span class="orb orb-b"></span>
  <span class="orb orb-c"></span>
</div>

<header class="app-bar">
  <h1 class="marquee-title">
    <svg class="icon icon-title" aria-hidden="true"><use href="#icon-reel"></use></svg>
    Movie Connect
  </h1>
  <button id="manage-btn" class="icon-btn" type="button" aria-label="Manage actor list" title="Manage actor list">
    <svg class="icon" aria-hidden="true"><use href="#icon-settings"></use></svg>
  </button>
</header>

<main>
  <section class="card" id="game-card" aria-live="polite">
    <div class="spotlight" aria-hidden="true"></div>

    <div class="loading-overlay" id="loading-overlay" aria-hidden="true">
      <div class="lottie-box" id="lottie-box"></div>
    </div>

    <div class="actor-slot" id="slot-el-1">
      <div class="avatar-ring">
        <div class="avatar" id="avatar-1">
          <span class="initials" id="initials-1"></span>
          <img class="photo" id="photo-1" alt="" hidden>
        </div>
      </div>
      <p class="actor" id="actor-1">Tap "New Pair" to start</p>
    </div>

    <div class="vs-badge" id="vs-badge" aria-hidden="true">
      <span class="vs-text">VS</span>
    </div>

    <div class="actor-slot" id="slot-el-2">
      <div class="avatar-ring">
        <div class="avatar" id="avatar-2">
          <span class="initials" id="initials-2"></span>
          <img class="photo" id="photo-2" alt="" hidden>
        </div>
      </div>
      <p class="actor" id="actor-2">&nbsp;</p>
    </div>
  </section>

  <button id="get-actors" class="primary-btn" type="button">
    <svg class="icon icon-refresh" aria-hidden="true"><use href="#icon-refresh"></use></svg>
    New Pair
  </button>

  <p class="hint">Connect the two actors through a chain of shared movies.</p>
</main>

<dialog id="manage-dialog">
  <form method="dialog" class="manage-form" id="manage-form">
    <h2>Manage Actors</h2>

    <div class="add-row">
      <label for="new-actor-name" class="sr-only">Actor name</label>
      <input id="new-actor-name" type="text" placeholder="Add an actor, e.g. Zendaya" autocomplete="off">
      <button id="add-actor-btn" class="primary-btn small" type="button">Add</button>
    </div>
    <p id="add-error" class="error" role="alert"></p>

    <div class="list-header">
      <span id="actor-count">0 actors</span>
      <button id="reset-btn" class="text-btn" type="button">Reset to defaults</button>
    </div>

    <ul id="actor-list" class="actor-list"></ul>

    <div class="dialog-actions">
      <button value="close" class="primary-btn" type="submit">Done</button>
    </div>
  </form>
</dialog>

<script src="js/vendor/lottie-light.min.js"></script>
<script src="js/actors.js"></script>
<script src="js/app.js"></script>
</body>
</html>
